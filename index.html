
<!DOCTYPE html>
<html>
<head>
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Weather Application</h1>
    <p>Check the weather of your city</p>
    <input type="text" id="city" placeholder="Enter city name">
    <button onclick="getWeather()">Search</button>
    <div id="result">
        <h2>Weather Details</h2>
        <p id="weather"></p>
    </div>
    <script>
        async function getWeather() {
            var city = document.getElementById("city").value;
            var apiKey = "954f492a7078748c1d72e343688b2052";
            if (city == "") {
                alert("Enter a city name");
                return;
            }
            var url = "https://api.openweathermap.org/data/2.5/weather?q="
                + encodeURIComponent(city) + "&appid=" + apiKey + "&units=metric";
            var response = await fetch(url);
            var data = await response.json();
            if (response.ok) {
                document.getElementById("weather").innerHTML =
                    "City: " + data.name + "<br><br>" +
                    "Temperature: " + data.main.temp + " °C<br><br>" +
                    "Weather: " + data.weather[0].description + "<br><br>" +
                    "Humidity: " + data.main.humidity + "%";

            } else {
                document.getElementById("weather").innerHTML =
                    "City not found";

            }
        }
    </script>
</body>
</html>
